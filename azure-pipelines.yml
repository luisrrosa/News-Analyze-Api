# NEWS ANALYZE API — integración continua (Azure DevOps)
# Ejecuta las pruebas contra un MongoDB efímero y construye la imagen Docker.
# Cualquier prueba fallida bloquea la fusión (configurar como política de rama en main).

trigger:
  branches:
    include: [main, develop, feature/*, fix/*]

pr:
  branches:
    include: [main, develop]

pool:
  vmImage: ubuntu-latest

resources:
  containers:
    - container: mongo
      image: mongo:7
      ports:
        - 27017:27017

variables:
  PYTHON_VERSION: '3.12'
  TEST_MONGODB_URI: 'mongodb://localhost:27017'

stages:
  - stage: test
    displayName: Pruebas
    jobs:
      - job: pytest
        displayName: pytest (seguridad, RBAC, auditoría)
        services:
          mongo: mongo
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(PYTHON_VERSION)
          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements-dev.txt
              sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa
            displayName: Instalar dependencias (incluye Tesseract para la ruta OCR)
          # PDF de referencia: NO se versiona (contiene información institucional). Se sube una vez a
          # Pipelines > Library > Secure files con el nombre de la variable REFERENCE_PDF_SECURE_FILE.
          # Si la variable no está definida, el paso se omite y las pruebas de extracción quedan como "skipped".
          - task: DownloadSecureFile@1
            name: referencePdf
            displayName: Descargar PDF de referencia (Secure file)
            condition: ne(variables['REFERENCE_PDF_SECURE_FILE'], '')
            inputs:
              secureFile: $(REFERENCE_PDF_SECURE_FILE)
          - script: |
              # Si el paso anterior se omitió, la macro queda sin expandir y el archivo no existe.
              if [ -f "$SECURE_PDF_PATH" ]; then export REFERENCE_PDF="$SECURE_PDF_PATH"; fi
              python -m pytest -q -rs --junitxml=test-results.xml
            displayName: Ejecutar pruebas
            env:
              SECURE_PDF_PATH: $(referencePdf.secureFilePath)
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFiles: test-results.xml
              testRunTitle: news-analyze-api

  - stage: build
    displayName: Imagen Docker
    dependsOn: test
    jobs:
      - job: docker
        steps:
          # La publicación en Azure Container Registry se añade al definir la infraestructura (D-10).
          - script: docker build -t news-analyze-api:$(Build.BuildId) .
            displayName: Construir imagen
