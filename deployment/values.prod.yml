nameOverride: news-analyze-api

image:
  pullPolicy: Always
  # Variables no secretas. Los secretos llegan por overrideValues (deployment/pipeline.yml).
  env:
    APP_ROLE: "api"
    APP_ENV: "production"
    PORT: "80"
    WORKERS: "2"
    MONGODB_DB_NAME: "news_analyze_prod"
    # El PDF subido solo vive en Redis mientras el worker lo procesa (no se conserva).
    STORAGE_BACKEND: "memory"
    UPLOAD_TTL_SECONDS: "3600"
    DOCUMENTS_MAX_SIZE_MB: "50"
    # Solo la web (proxy interno) llama a la API: se confía en su X-Forwarded-For.
    TRUST_PROXY_HEADERS: "true"
    COOKIE_SECURE: "true"
    OCR_ENGINE: "tesseract"
    SFTP_PORT: "22"
    SFTP_POLL_SECONDS: "300"
    TZ: "America/Santo_Domingo"

service:
  port: 80

# Sin ingress: la API no se publica en internet. La web la llama como http://news-analyze-api.
ingress:
  enabled: false

livenessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
readinessProbe:
  enabled: true
  httpGet:
    path: /readyz
    port: http

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Solo la web (y el ingress, que esta API no usa) puede llamar a la API: nadie más del namespace compartido.
# Necesita un chart con networkPolicy (devops-template >= 1.1.0) y un clúster con política de red (azure/calico).
# Si el chart 1.0.91 no lo soporta, aplicar deployment/networkpolicy.yaml (ver docs/despliegue/API.md).
networkPolicy:
  enabled: true
  ingressControllerNamespace: ingress-nginx
  allowSameNamespace: false
  extraIngress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: news-analyze-web
