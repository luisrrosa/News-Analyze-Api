# Entorno de desarrollo NEWS ANALYZE.
#   api     FastAPI (autenticación, usuarios, roles, auditoría, documentos, noticias, revisión)
#   worker  Celery: extracción de PDF
#   beat    Celery beat: despachador del outbox (5 s) y reconciliación de trabajos caídos (60 s)
#   agent   Agente de ingesta por carpeta (./storage/inbox)
#   web     Next.js (repo ../newsAnalyze): interfaz y proxy /api/v1 → api
#   redis   Broker de la cola
# MongoDB sigue en Atlas (MONGODB_URI en .env). El navegador solo habla con web (puerto 3000).
#
#   docker compose up --build
#
# Puertos publicados configurables: WEB_PORT (3000). La api y redis no se publican fuera de la red interna.
#
x-api-common: &api-common
  build: .
  env_file: .env
  environment:
    REDIS_URL: redis://redis:6379/0
    STORAGE_BACKEND: local          # en desarrollo el PDF se guarda en ./storage (en AKS: memory)
    STORAGE_ROOT: /data/storage
    INGEST_FOLDER: /data/storage/inbox
    COOKIE_SECURE: "false"          # desarrollo sobre http://localhost
    TRUST_PROXY_HEADERS: "true"     # la api solo es accesible desde web
    MONGODB_DNS_SERVERS: ""         # dentro de Docker el DNS del contenedor resuelve mongodb+srv
  volumes:
    - ./storage:/data/storage       # PDF originales (fuera de la imagen)
  depends_on:
    - redis
  restart: unless-stopped

services:
  api:
    <<: *api-common
    expose:
      - "8000"

  worker:
    <<: *api-common
    command: ["worker_only"]        # rol de docker-entrypoint.sh (beat va aparte)
    healthcheck:
      disable: true

  beat:
    <<: *api-common
    command: ["beat"]
    healthcheck:
      disable: true

  agent:
    <<: *api-common
    command: ["agent"]
    healthcheck:
      disable: true

  web:
    build:
      context: ../newsAnalyze
    # Sin env_file: la interfaz no necesita secretos (MongoDB, JWT y auditoría viven solo en la api).
    environment:
      API_INTERNAL_URL: http://api:8000   # se lee al arrancar
    ports:
      - "${WEB_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    restart: unless-stopped
